name: CROUS monitor

on:
  schedule:
    - cron: "7,37 * * * *"    # backup only; off-peak minutes
  workflow_dispatch:

permissions:
  contents: write   # save seen_listings.sqlite3
  actions: write    # allow the run to start the next run

concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll CROUS for ~14 minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          CHECK_INTERVAL_SECONDS: "60"
          HEADLESS: "true"
        run: python main.py --duration 840

      - name: Save seen listings
        if: always()
        run: |
          git config user.name "crous-bot"
          git config user.email "crous-bot@users.noreply.github.com"
          git add seen_listings.sqlite3
          git diff --cached --quiet || git commit -m "Update seen listings [skip ci]"
          git pull --rebase -X theirs || true
          git push || true

      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main
